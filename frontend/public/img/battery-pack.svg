<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif" role="img"><style>.t{font-size:13px;fill:#1b2a3a}.s{font-size:11px;fill:#4a5b6c}.h{font-size:15px;font-weight:700;fill:#1b2a3a}.b{fill:#fff;stroke:#0d7a70;stroke-width:2}.o{stroke:#f57c00;stroke-width:5;fill:none;stroke-linecap:round}.a{stroke:#4a5b6c;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#4a5b6c"/></marker></defs><rect width="640" height="300" rx="10" fill="#f4f8f8"/><text x="20" y="28" class="h">From cell to pack</text>
<g class="b"><rect x="20" y="80" width="130" height="100" rx="8"/><rect x="255" y="60" width="150" height="140" rx="8"/><rect x="500" y="40" width="125" height="180" rx="8"/></g>
<rect x="55" y="105" width="60" height="50" rx="8" fill="#e0f2f1" stroke="#0d7a70" stroke-width="2"/><text x="85" y="135" text-anchor="middle" class="t">Cell</text>
<g fill="#e0f2f1" stroke="#0d7a70" stroke-width="2"><rect x="270" y="75" width="28" height="42" rx="4"/><rect x="305" y="75" width="28" height="42" rx="4"/><rect x="340" y="75" width="28" height="42" rx="4"/><rect x="270" y="125" width="28" height="42" rx="4"/><rect x="305" y="125" width="28" height="42" rx="4"/><rect x="340" y="125" width="28" height="42" rx="4"/></g>
<text x="330" y="190" text-anchor="middle" class="t">Module</text>
<g fill="#e0f2f1" stroke="#0d7a70" stroke-width="2"><rect x="512" y="55" width="100" height="26"/><rect x="512" y="88" width="100" height="26"/><rect x="512" y="121" width="100" height="26"/><rect x="512" y="154" width="100" height="26"/></g>
<text x="562" y="203" text-anchor="middle" class="t">Pack</text>
<path class="a" d="M152 130h100M407 130h90"/>
<text x="20" y="225" class="t" font-weight="700">Series</text><text x="68" y="225" class="s">adds voltage</text><text x="170" y="225" class="t" font-weight="700">Parallel</text><text x="232" y="225" class="s">adds capacity</text>
<rect x="14" y="245" width="612" height="42" rx="8" fill="#fff" stroke="#0d7a70"/><text x="26" y="263" class="s">Also inside the pack: contactors, service disconnect, BMS, sensors, cooling plates.</text><text x="26" y="279" class="s">NMC = high energy density. LFP = long life and better thermal stability.</text></svg>

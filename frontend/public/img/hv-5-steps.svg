<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif" role="img"><style>.t{font-size:13px;fill:#1b2a3a}.s{font-size:11px;fill:#4a5b6c}.h{font-size:15px;font-weight:700;fill:#1b2a3a}.b{fill:#fff;stroke:#0d7a70;stroke-width:2}.o{stroke:#f57c00;stroke-width:5;fill:none;stroke-linecap:round}.a{stroke:#4a5b6c;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#4a5b6c"/></marker></defs><rect width="640" height="300" rx="10" fill="#f4f8f8"/><text x="20" y="28" class="h">The 5-step HV safety procedure</text>
<g class="b"><rect x="14" y="70" width="112" height="120" rx="8"/><rect x="140" y="70" width="112" height="120" rx="8"/><rect x="266" y="70" width="112" height="120" rx="8"/><rect x="392" y="70" width="112" height="120" rx="8"/><rect x="518" y="70" width="112" height="120" rx="8"/></g>
<g fill="#0d7a70"><circle cx="70" cy="70" r="16"/><circle cx="196" cy="70" r="16"/><circle cx="322" cy="70" r="16"/><circle cx="448" cy="70" r="16"/><circle cx="574" cy="70" r="16"/></g>
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><text x="70" y="75">1</text><text x="196" y="75">2</text><text x="322" y="75">3</text><text x="448" y="75">4</text><text x="574" y="75">5</text></g>
<g class="t" text-anchor="middle" font-weight="700"><text x="70" y="115">Disconnect</text><text x="70" y="131">&amp; isolate</text><text x="196" y="115">Lock out</text><text x="196" y="131">&amp; tag out</text><text x="322" y="115">Wait &amp; verify</text><text x="322" y="131">zero volts</text><text x="448" y="115">Discharge</text><text x="448" y="131">if required</text><text x="574" y="115">Barrier</text><text x="574" y="131">&amp; cover</text></g>
<g class="s" text-anchor="middle"><text x="70" y="158">Remove HV</text><text x="70" y="172">service plug</text><text x="196" y="158">Personal lock</text><text x="196" y="172">+ name tag</text><text x="322" y="158">Live-dead-live</text><text x="322" y="172">meter check</text><text x="448" y="158">Approved tool</text><text x="448" y="172">only</text><text x="574" y="158">Cover nearby</text><text x="574" y="172">orange parts</text></g>
<path class="a" d="M128 130h10M254 130h10M380 130h10M506 130h10"/>
<rect x="14" y="225" width="616" height="50" rx="8" fill="#fff3e0" stroke="#f57c00"/><text x="28" y="246" class="t" font-weight="700">Never skip a step.</text><text x="28" y="264" class="s">Remove locks and tags only when the work is finished and everyone is clear of the vehicle.</text></svg>

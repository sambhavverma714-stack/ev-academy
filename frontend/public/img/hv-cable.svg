<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif" role="img"><style>.t{font-size:13px;fill:#1b2a3a}.s{font-size:11px;fill:#4a5b6c}.h{font-size:15px;font-weight:700;fill:#1b2a3a}.b{fill:#fff;stroke:#0d7a70;stroke-width:2}.o{stroke:#f57c00;stroke-width:5;fill:none;stroke-linecap:round}.a{stroke:#4a5b6c;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#4a5b6c"/></marker></defs><rect width="640" height="300" rx="10" fill="#f4f8f8"/><text x="20" y="28" class="h">Inside an HV cable (cross-section)</text>
<circle cx="150" cy="150" r="105" fill="#f57c00"/><circle cx="150" cy="150" r="88" fill="#cfd8dc"/><circle cx="150" cy="150" r="70" fill="#78909c"/><circle cx="150" cy="150" r="50" fill="#fff"/><circle cx="150" cy="150" r="30" fill="#b87333"/>
<g class="t"><path d="M262 90H320M240 125H320M222 160H320M190 195H320" stroke="#4a5b6c" stroke-width="1"/>
<text x="326" y="94" font-weight="700">Orange outer sheath</text><text x="326" y="109" class="s">Marks the circuit as high voltage</text>
<text x="326" y="129" font-weight="700">Braided shield</text><text x="326" y="144" class="s">Must stay continuous (EMI + safety)</text>
<text x="326" y="164" font-weight="700">Thick insulation</text><text x="326" y="179" class="s">Check for cuts, heat damage, cracks</text>
<text x="326" y="199" font-weight="700">Copper conductor</text><text x="326" y="214" class="s">Poor crimp = heat and arcing</text></g>
<rect x="260" y="238" width="366" height="48" rx="8" fill="#fff3e0" stroke="#f57c00"/><text x="272" y="258" class="s">Repair only if the manufacturer permits it, with approved parts,</text><text x="272" y="274" class="s">a calibrated crimp tool, then an insulation resistance test.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif" role="img"><style>.t{font-size:13px;fill:#1b2a3a}.s{font-size:11px;fill:#4a5b6c}.h{font-size:15px;font-weight:700;fill:#1b2a3a}.b{fill:#fff;stroke:#0d7a70;stroke-width:2}.o{stroke:#f57c00;stroke-width:5;fill:none;stroke-linecap:round}.a{stroke:#4a5b6c;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#4a5b6c"/></marker></defs><rect width="640" height="300" rx="10" fill="#f4f8f8"/><text x="20" y="28" class="h">Drive system: power flow and regeneration</text>
<g class="b"><rect x="20" y="100" width="150" height="90" rx="8"/><rect x="245" y="100" width="150" height="90" rx="8"/><rect x="470" y="100" width="150" height="90" rx="8"/></g>
<g class="t" text-anchor="middle" font-weight="700"><text x="95" y="140">HV battery</text><text x="320" y="140">Inverter</text><text x="545" y="140">Traction motor</text></g>
<g class="s" text-anchor="middle"><text x="95" y="160">DC, 300-800 V</text><text x="320" y="160">IGBT / SiC switches</text><text x="545" y="160">PMSM or induction</text></g>
<path class="a" d="M172 125h70M397 125h70"/><text x="207" y="116" text-anchor="middle" class="s">DC</text><text x="432" y="116" text-anchor="middle" class="s">3-phase AC</text>
<path class="a" d="M467 170h-70M243 170h-70" stroke="#0d7a70"/><text x="320" y="214" text-anchor="middle" class="s" fill="#0d7a70">Regenerative braking: energy flows back</text>
<rect x="500" y="45" width="90" height="34" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/><text x="545" y="67" text-anchor="middle" class="t">Resolver</text><path d="M545 79v21" stroke="#f57c00" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="245" y="45" width="150" height="34" rx="6" fill="#fff" stroke="#4a5b6c"/><text x="320" y="67" text-anchor="middle" class="t">Controller + DTCs</text><path d="M395 62h105" stroke="#4a5b6c" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="14" y="240" width="612" height="46" rx="8" fill="#fff" stroke="#0d7a70"/><text x="26" y="259" class="s">The resolver tells the controller the rotor angle. A bad signal means torque errors or limp mode.</text><text x="26" y="276" class="s">Read DTCs and freeze-frame data first, then check wiring and connectors before any parts.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial,Helvetica,sans-serif" role="img"><style>.t{font-size:13px;fill:#1b2a3a}.s{font-size:11px;fill:#4a5b6c}.h{font-size:15px;font-weight:700;fill:#1b2a3a}.b{fill:#fff;stroke:#0d7a70;stroke-width:2}.o{stroke:#f57c00;stroke-width:5;fill:none;stroke-linecap:round}.a{stroke:#4a5b6c;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#4a5b6c"/></marker></defs><rect width="640" height="300" rx="10" fill="#f4f8f8"/><text x="20" y="28" class="h">Where the high-voltage parts sit (top view)</text>
<rect x="70" y="60" width="500" height="190" rx="60" fill="#fff" stroke="#4a5b6c" stroke-width="2"/>
<rect x="200" y="95" width="230" height="120" rx="8" fill="#e0f2f1" stroke="#0d7a70" stroke-width="2"/><text x="315" y="150" text-anchor="middle" class="t" font-weight="700">HV battery pack</text><text x="315" y="168" text-anchor="middle" class="s">under the floor</text>
<rect x="470" y="105" width="80" height="45" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/><text x="510" y="132" text-anchor="middle" class="t">Inverter</text>
<rect x="470" y="160" width="80" height="45" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/><text x="510" y="187" text-anchor="middle" class="t">Motor</text>
<rect x="90" y="105" width="80" height="45" rx="6" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/><text x="130" y="125" text-anchor="middle" class="t">Onboard</text><text x="130" y="140" text-anchor="middle" class="t">charger</text>
<rect x="90" y="160" width="80" height="45" rx="6" fill="#fff" stroke="#4a5b6c" stroke-width="2"/><text x="130" y="187" text-anchor="middle" class="t">12 V battery</text>
<path class="o" d="M170 128h30M430 128h40M430 182h40M510 150v10"/>
<rect x="14" y="262" width="14" height="6" fill="#f57c00"/><text x="34" y="269" class="s">Orange = high-voltage cable. Treat it as live until proven dead.</text><text x="20" y="52" class="s">Layout varies by model. Always check the service information.</text></svg>
